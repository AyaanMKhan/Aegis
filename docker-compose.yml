services:
  db:
    image: postgres:18-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes: ["pgdata:/var/lib/postgresql/data"]
  
  backend:
    build:
      context: .
      target: builder
    container_name: fastapi-backend
    environment:
      PORT: 8000
    ports:
      - '8000:8000'
    restart: "no"

  
  frontend:
    container_name: frontend-react
    build: 
      context: ./frontend
      target: builder
    networks:
      - client-side
    ports:
      - 3000:3000
    restart: "no"



volumes:
  pgdata
services:
  backend:
    build:
      context: .
      target: backend
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis@db:5432/aegis
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:18-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
      DATABASE_URL: postgresql+psycopg://aegis:aegis@db:5432/aegis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: "no"

  # frontend:
  #   container_name: frontend-react
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   restart: "no"

volumes:
  pgdata:
